name: Build Tich Loc Play Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    env:
      TICHLOC_KEYSTORE_PATH: ${{ github.workspace }}/android-app/tichloc-upload.p12
      TICHLOC_STORE_PASSWORD: ${{ secrets.TICHLOC_STORE_PASSWORD }}
      TICHLOC_KEY_ALIAS: ${{ secrets.TICHLOC_KEY_ALIAS }}
      TICHLOC_KEY_PASSWORD: ${{ secrets.TICHLOC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Test and build bundled interface
        run: |
          npm ci
          npm test
          npm run build
      - name: Restore encrypted upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TICHLOC_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const k of ['KEYSTORE_BASE64','TICHLOC_STORE_PASSWORD','TICHLOC_KEY_ALIAS','TICHLOC_KEY_PASSWORD']) { if (!process.env[k]) throw Error('Missing GitHub Secret: '+k); } fs.writeFileSync(process.env.TICHLOC_KEYSTORE_PATH,Buffer.from(process.env.KEYSTORE_BASE64,'base64'),{mode:0o600});"
          keytool -list -keystore "$TICHLOC_KEYSTORE_PATH" -storetype PKCS12 -storepass:env TICHLOC_STORE_PASSWORD -alias "$TICHLOC_KEY_ALIAS"
      - name: Generate release Android project
        run: |
          npx cap add android
          npx cap sync android
          node configure-android.mjs --release
      - name: Build signed AAB and release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Audit release manifest, signature and packaged version
        run: |
          node configure-android.mjs --audit --release
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          node audit-release.mjs
      - name: Collect public release files
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/bundle/release/app-release.aab release-output/Tich-Loc-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk release-output/Tich-Loc-release.apk
          keytool -exportcert -rfc -keystore "$TICHLOC_KEYSTORE_PATH" -storetype PKCS12 -storepass:env TICHLOC_STORE_PASSWORD -alias "$TICHLOC_KEY_ALIAS" -file release-output/upload-certificate.pem
          node --input-type=module -e "import fs from 'node:fs';import crypto from 'node:crypto';const lines=fs.readdirSync('release-output').sort().map(n=>crypto.createHash('sha256').update(fs.readFileSync('release-output/'+n)).digest('hex')+'  '+n);fs.writeFileSync('release-output/SHA256SUMS.txt',lines.join('\n')+'\n');"
      - name: Upload release artifacts (no private keys)
        uses: actions/upload-artifact@v4
        with:
          name: Tich-Loc-Play-Release
          path: android-app/release-output/
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner signing material
        if: always()
        run: rm -f "$TICHLOC_KEYSTORE_PATH"

